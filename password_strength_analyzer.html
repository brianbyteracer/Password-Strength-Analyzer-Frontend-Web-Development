<html>
  <head>
    <title>Password Strength Analyzer</title>
    <style>
      body {
        background-image: url('cyber.jpg'); 
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        color: #fff;
        display: flex;
        justify-content: center; 
        align-items: center; 
        height: 100vh;
        margin: 0;
      }

      .content {
        text-align: center;
        padding: 50px;
        background-color: rgba(0, 0, 0, 0.8);
        border-radius: 10px;
      }

      h1 {
        color: #fff;
      }

      #password {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: none;
        box-sizing: border-box;
      }

      #strength, #suggested-password {
        display: block;
        margin: 10px 0;
        padding: 5px;
        border-radius: 5px;
        text-align: center;
      }

      span {
        background: #222;
        color: #fff;
        display: block;
        margin: 10px 0;
        padding: 5px 10px;
      }

      .button {
        padding: 10px 20px;
        margin: 10px 0;
        background-color: #007BFF;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .button:hover {
        background-color: #0056b3;
      }

      .password-container {
        position: relative;
        width: 100%;
      }

      .toggle-password {
        position: absolute;
        margin-top: 10px;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #000000;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>Password Strength Analyzer</h1>
      <div class="password-container">
        <label for="password">Password:</label>
        <input type="password" id="password" oninput="checkPasswordStrength()">
        <button class="toggle-password" onclick="togglePassword()">Show</button>
      </div>
      <span id="strength">Enter a password</span>
      <button class="button" onclick="suggestPassword()">Suggest Password</button>
      <span id="suggested-password"></span>
    </div>
    <script>
      function checkPasswordStrength() {
        var password = document.getElementById("password").value;
        var strength = document.getElementById("strength");

        if (password.length === 0) {
          strength.style.color = "#fff";
          strength.innerHTML = "Enter a password";
          return;
        }

        var checks = [
          "[A-Z]",
          "[a-z]",
          "[0-9]",
          "[!@#$%^&*]"
        ];
        var passed = 0;

        checks.forEach(function(check) {
          if (new RegExp(check).test(password)) {
            passed++;
          }
        });

        var color = "";
        var text = "";
        switch (passed) {
          case 0:
          case 1:
            color = "red";
            text = "Very Weak";
            break;
          case 2:
            color = "orange";
            text = "Weak";
            break;
          case 3:
            color = "green";
            text = "Strong";
            break;
          case 4:
            color = "darkgreen";
            text = "Very Strong";
            break;
        }

        strength.style.color = color;
        strength.innerHTML = text;
      }

      function suggestPassword() {
        var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        var passwordLength = 12;
        var password = "";
        for (var i = 0; i < passwordLength; i++) {
          var randomNumber = Math.floor(Math.random() * chars.length);
          password += chars.charAt(randomNumber);
        }
        document.getElementById("password").value = password;
        document.getElementById("suggested-password").innerText = "Suggested Password: " + password;
        checkPasswordStrength();
      }

      function togglePassword() {
        var passwordInput = document.getElementById("password");
        var toggleButton = document.querySelector(".toggle-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleButton.textContent = "Hide";
        } else {
          passwordInput.type = "password";
          toggleButton.textContent = "Show";
        }
      }
    </script>
  </body>
</html>
